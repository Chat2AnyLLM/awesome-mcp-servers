slug: ats-jobs-mcp
title: ATS Jobs MCP
description: "New job postings since any date or window (24h, 7d, 30d) from Ashby, Greenhouse, Lever and SmartRecruiters job boards. Local stdio server; needs your own Apify API token."
url: https://github.com/GeminiGeorge22/ats-jobs-mcp
tags:
  - jobs
  - recruiting
  - ats
  - data
category: data
author: GeminiGeorge22
license: MIT
installations:
  npm:
    type: stdio
    command: npx
    args:
      - -y
      - github:GeminiGeorge22/ats-jobs-mcp
    env:
      APIFY_TOKEN: ${APIFY_TOKEN}
